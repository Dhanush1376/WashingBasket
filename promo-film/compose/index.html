<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Washing Basket — brand film</title>
<script src="assets/wordmark.js"></script>
<script src="assets/logo/parts.js"></script>
<script src="assets/crops.js"></script>
<style>
@font-face { font-family: Inter; font-weight: 500; src: url(assets/fonts/Inter_500Medium.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(assets/fonts/Inter_600SemiBold.ttf); }
@font-face { font-family: Inter; font-weight: 700; src: url(assets/fonts/Inter_700Bold.ttf); }
:root { --bg: #EFE9DF; --ink: #0A1C3E; --navy: #013E86; --orange: #FE8701; --soft-orange: #FFA742; --red: #D30D24; --sky: #54B6F8; --green: #16A34A; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: Inter, sans-serif; color: var(--ink); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
.abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }

/* kinetic headlines */
.head { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -0.035em; line-height: 1.06; display: none; }
.head .ln { display: block; padding: 0 30px; }
.head .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.02em 0.12em; margin-bottom: -0.1em; }
.head .w > span { display: inline-block; will-change: transform; }
.head .accent { color: var(--navy); }
.head .muted { color: #8A8F9C; }

/* phone */
#phone { width: 640px; height: 1338px; transform-origin: 0 0; }
#phone .frame { position: absolute; inset: 0; border-radius: 104px;
  background: linear-gradient(140deg, #F6F4F0 0%, #CFCBC4 22%, #EAE7E1 48%, #BDB8B0 78%, #E9E6E0 100%);
  box-shadow: 0 70px 110px rgba(60,48,30,.20), 0 24px 40px rgba(60,48,30,.14), inset 0 0 0 1.5px rgba(255,255,255,.7); }
#phone .bezel { position: absolute; inset: 9px; border-radius: 96px; background: #0B0D12; }
#screen { position: absolute; left: 20px; top: 20px; width: 600px; height: 1298px; border-radius: 86px; overflow: hidden; background: #fff; }
#screen img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
#island { position: absolute; left: 50%; top: 32px; width: 168px; height: 48px; margin-left: -84px; border-radius: 26px; background: #05070b; z-index: 9; }
#tap { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; background: rgba(1,62,134,.18); border: 5px solid rgba(1,62,134,.55); opacity: 0; z-index: 10; }
#dim { position: absolute; inset: 0; background: var(--bg); opacity: 0; z-index: 7; }
#shadow { width: 700px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(60,48,30,.28), rgba(60,48,30,0)); }

/* lifted UI cards */
.card { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; border-radius: 26px; background: #fff; opacity: 0; will-change: transform, opacity; }
.card img { position: absolute; width: 780px; height: 1688px; }
.card .lay { position: absolute; left: 0; top: 0; }
.cover { position: absolute; }
.caret { position: absolute; width: 3px; background: var(--navy); }
.ring { position: absolute; border: 5px solid var(--orange); border-radius: 22px; opacity: 0; }
.scan .c { position: absolute; width: 22%; height: 22%; border: 7px solid var(--orange); }
.scan .bar { position: absolute; left: 4%; right: 4%; height: 5px; border-radius: 3px; background: linear-gradient(90deg, rgba(254,135,1,0), #FE8701 20%, #FFD39A 50%, #FE8701 80%, rgba(254,135,1,0)); box-shadow: 0 0 22px 8px rgba(254,135,1,.4); }

/* graphics */
.chip { position: absolute; padding: 18px 34px; border-radius: 60px; font-weight: 700; font-size: 40px; white-space: nowrap; }
#counter { text-align: center; width: 1080px; }
#counter .lab { font-weight: 600; font-size: 34px; color: #6B7080; letter-spacing: .01em; }
#counter .num { font-weight: 700; font-size: 190px; letter-spacing: -0.05em; color: var(--ink); line-height: 1.05; font-variant-numeric: tabular-nums; }
#counter .rule { font-weight: 500; font-size: 32px; color: #6B7080; margin-top: 10px; }
.check { width: 300px; height: 300px; border-radius: 50%; background: var(--green); box-shadow: 0 30px 60px rgba(22,163,74,.3); }
.wave { position: absolute; border-radius: 50%; border: 4px solid rgba(22,163,74,.5); }
.cal { position: absolute; border-radius: 18px; }
.cloth { position: absolute; border-radius: 26px; }
.cloth::after { content: ''; position: absolute; left: 8%; right: 8%; top: 38%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); }
.illus { position: absolute; }
.logoPart { position: absolute; }
#cta span { display: inline-block; padding: 28px 64px; border-radius: 70px; background: var(--navy); color: #fff; font-weight: 700; font-size: 40px; letter-spacing: -.01em; box-shadow: 0 20px 40px rgba(1,62,134,.25); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="timeline.js"></script>
</body>
</html>
